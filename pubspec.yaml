name: yooz_watch
description: Clean rewrite of Yooz Watch companion (cn.yoozworld.watch)
publish_to: "none"
version: 1.2.0+100200

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^14.6.2
  flutter_riverpod: ^2.6.1
  permission_handler: ^11.3.1
  mobile_scanner: ^6.0.2
  geolocator: ^13.0.2
  url_launcher: ^6.3.1
  webview_flutter: ^4.8.0
  image_picker: ^1.1.2
  shared_preferences: ^2.3.3
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/lang/
    - assets/jsonDefault/
    - assets/images/common/
    - assets/images/device/
    - assets/images/find/
    - assets/images/home/
    - assets/images/login/
    - assets/images/me/
    - assets/images/msl/
    - assets/images/tabBar/
    - assets/images/theme/
    - assets/icons/
    - assets/fonts/
  fonts:
    - family: ProductSans
      fonts:
        - asset: assets/fonts/Product-Sans-Regular.ttf
        - asset: assets/fonts/Product-Sans-Bold.ttf
          weight: 700
        - asset: assets/fonts/Product-Sans-Italic.ttf
          style: italic
